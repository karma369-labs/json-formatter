    <!-- Applies the visitor's theme before first paint. The prerendered HTML is
         built with no browser APIs, so it ships without a data-theme attribute
         and CSS falls back to the dark `:root` block — without this a
         light-theme visitor would flash dark until React's first layout effect.
         Must mirror readTheme() in src/contexts/theme-context.ts, and the key
         must match storage.ts's THEME_KEY character-for-character. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jsonfmt:theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Consent Mode v2 default — must run synchronously BEFORE gtag.js loads, so a
         returning visitor who already accepted isn't re-blocked on every reload.
         Fails closed: if localStorage is unreadable, consent stays denied. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var storedConsent = null;
      try { storedConsent = localStorage.getItem('jsonfmt:cookie-consent'); } catch (e) {}
      gtag('consent', 'default', {
        analytics_storage: storedConsent === 'granted' ? 'granted' : 'denied'
      });
    </script>

    <!-- Google tag (gtag.js) -->

    <script>
      gtag('js', new Date());
      gtag('config', 'G-SJZJ1LY3FK');
    </script>
